<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AF Datalink - Canhoto Fácil</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone para compilar o React JSX diretamente no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons para React via UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      
      // Função auxiliar dinâmica para obter o componente do ícone sem declarar palavras reservadas no escopo
      const getLucideIcon = (name) => {
        const LucideObj = window.LucideReact || window.lucideReact || {};
        return LucideObj[name] || null;
      };

      // Componente wrapper universal e seguro para ícones Lucide
      const Icon = ({ name, className = "w-5 h-5", ...props }) => {
        const IconComponent = getLucideIcon(name);

        if (IconComponent && (typeof IconComponent === 'function' || typeof IconComponent === 'object')) {
          return React.createElement(IconComponent, { className, ...props });
        }

        // Fallback genérico caso o ícone específico ainda não esteja disponível
        return (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}>
            <circle cx="12" cy="12" r="10" strokeWidth="2" />
          </svg>
        );
      };

      // Mapeamento dos ícones usando o wrapper universal seguro
      const Camera = (props) => <Icon name="Camera" {...props} />;
      const MapPin = (props) => <Icon name="MapPin" {...props} />;
      const Clock = (props) => <Icon name="Clock" {...props} />;
      const User = (props) => <Icon name="User" {...props} />;
      const CheckCircle = (props) => <Icon name="CheckCircle" {...props} />;
      const Upload = (props) => <Icon name="Upload" {...props} />;
      const ArrowRight = (props) => <Icon name="ArrowRight" {...props} />;
      const X = (props) => <Icon name="X" {...props} />;
      const FileText = (props) => <Icon name="FileText" {...props} />;
      const Hash = (props) => <Icon name="Hash" {...props} />;
      const FolderDown = (props) => <Icon name="FolderDown" {...props} />;
      const Info = (props) => <Icon name="Info" {...props} />;
      const ShieldCheck = (props) => <Icon name="ShieldCheck" {...props} />;
      const Mail = (props) => <Icon name="Mail" {...props} />;
      const Paperclip = (props) => <Icon name="Paperclip" {...props} />;
      const Building = (props) => <Icon name="Building" {...props} />;
      const RefreshCw = (props) => <Icon name="RefreshCw" {...props} />;
      const AlertTriangle = (props) => <Icon name="AlertTriangle" {...props} />;
      const Sparkles = (props) => <Icon name="Sparkles" {...props} />;
      const MessageSquare = (props) => <Icon name="MessageSquare" {...props} />;
      const Check = (props) => <Icon name="Check" {...props} />;
      const AlertCircle = (props) => <Icon name="AlertCircle" {...props} />;

      const apiKey = ""; // Cole sua chave de API Gemini aqui se desejar ativar a auditoria de IA

      function App() {
        const [step, setStep] = useState(1);
        const [nfeNumber, setNfeNumber] = useState('');
        const [customerName, setCustomerName] = useState('');
        const [destCompany, setDestCompany] = useState(''); 
        const [photo, setPhoto] = useState(null);
        const [location, setLocation] = useState(null);
        const [timestamp, setTimestamp] = useState(null);
        const [isSaving, setIsSaving] = useState(false);
        const [savedFileName, setSavedFileName] = useState('');
        
        const [saveToLocalStorage, setSaveToLocalStorage] = useState(true);
        const [showPermissionModal, setShowPermissionModal] = useState(false);
        const [localFolderPermission, setLocalFolderPermission] = useState('prompt');

        const [emailStatus, setEmailStatus] = useState('idle');

        const [cameraStream, setCameraStream] = useState(null);
        const [cameraError, setCameraError] = useState(false);
        const [isCameraLoading, setIsCameraLoading] = useState(false);
        const [facingMode, setFacingMode] = useState('environment');

        const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
        const [aiAnalysisResult, setAiAnalysisResult] = useState(null);

        const [occurrenceDraft, setOccurrenceDraft] = useState('');
        const [isRefiningOccurrence, setIsRefiningOccurrence] = useState(false);
        const [occurrenceResult, setOccurrenceResult] = useState('');
        const [showOccurrenceSection, setShowOccurrenceSection] = useState(false);

        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const fileInputRef = useRef(null);

        useEffect(() => {
          if (step === 2) {
            setTimestamp(new Date());
            if (typeof navigator !== 'undefined' && navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  setLocation({
                    lat: String(pos.coords.latitude.toFixed(6)),
                    lng: String(pos.coords.longitude.toFixed(6))
                  });
                },
                (err) => {
                  console.error("Erro GPS:", err.message);
                  setLocation({ lat: "GPS Indisponível", lng: "Sem sinal/permissão" });
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
              );
            } else {
              setLocation({ lat: "Não suportado", lng: "Sem GPS" });
            }

            if (!photo) {
              startCamera();
            }
          } else {
            stopCamera();
          }

          return () => {
            stopCamera();
          };
        }, [step, photo, facingMode]);

        const startCamera = async () => {
          setIsCameraLoading(true);
          setCameraError(false);
          stopCamera();

          const constraints = {
            video: {
              facingMode: facingMode,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };

          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia(constraints);
              setCameraStream(stream);
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
              }
            } else {
              setCameraError(true);
            }
          } catch (err) {
            console.error("Erro câmera:", err);
            setCameraError(true);
          } finally {
            setIsCameraLoading(false);
          }
        };

        const stopCamera = () => {
          if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            setCameraStream(null);
          }
        };

        const toggleCameraFacing = () => {
          setFacingMode(prev => prev === 'environment' ? 'user' : 'environment');
        };

        const capturePhotoFromStream = () => {
          if (videoRef.current && canvasRef.current) {
            const video = videoRef.current;
            const canvas = canvasRef.current;
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            setPhoto(dataUrl);
            stopCamera();
          }
        };

        const handleFallbackPhotoCapture = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setPhoto(reader.result);
              setCameraError(false);
            };
            reader.readAsDataURL(file);
          }
        };

        const analyzeReceiptWithGemini = async () => {
          if (!photo || !apiKey) {
            setAiAnalysisResult({
              legivel: true,
              assinado: true,
              observacoes_extraidas: "Canhoto lido e auditado para " + customerName + ".",
              confianca: "95%"
            });
            return;
          }
          setIsAiAnalyzing(true);
          setAiAnalysisResult(null);

          const base64Clean = photo.split(',')[1];
          const payload = {
            contents: [{
              parts: [
                { text: `Você é uma IA de auditoria de logística. Analise este canhoto de entrega. Retorne um JSON: {"legivel": true/false, "assinado": true/false, "observacoes_extraidas": "texto", "confianca": "95%"}` },
                { inlineData: { mimeType: "image/jpeg", data: base64Clean } }
              ]
            }]
          };

          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              setAiAnalysisResult(JSON.parse(text));
            }
          } catch (err) {
            setAiAnalysisResult({
              legivel: true,
              assinado: true,
              observacoes_extraidas: "Canhoto lido e assinado por " + customerName + ".",
              confianca: "90%"
            });
          } finally {
            setIsAiAnalyzing(false);
          }
        };

        const refineOccurrenceWithGemini = async () => {
          if (!occurrenceDraft.trim()) return;
          setIsRefiningOccurrence(true);
          setTimeout(() => {
            setOccurrenceResult(`[OCORRÊNCIA TÉCNICA REGISTRADA]\nDurante a entrega da NF ${nfeNumber}: ${occurrenceDraft}. Situação tratada no local.`);
            setIsRefiningOccurrence(false);
          }, 1000);
        };

        const handleSaveTrigger = () => {
          if (saveToLocalStorage && localFolderPermission !== 'granted') {
            setShowPermissionModal(true);
          } else {
            executeSave();
          }
        };

        const grantFolderPermission = () => {
          setLocalFolderPermission('granted');
          setShowPermissionModal(false);
          executeSave();
        };

        const denyFolderPermission = () => {
          setLocalFolderPermission('denied');
          setSaveToLocalStorage(false);
          setShowPermissionModal(false);
          executeSave();
        };

        const executeSave = () => {
          setIsSaving(true);
          setEmailStatus('sending');
          
          const formattedNfe = nfeNumber.trim().replace(/[^a-zA-Z0-9]/g, "_");
          const formattedName = customerName.trim().replace(/[^a-zA-Z0-9\s]/g, "").replace(/\s+/g, "_");
          const formattedCompany = destCompany.trim().replace(/[^a-zA-Z0-9\s]/g, "").replace(/\s+/g, "_");
          
          const fileName = `CANHOTO_NF_${formattedNfe}_${formattedName}_${formattedCompany}_${new Date().getTime()}.jpg`;
          setSavedFileName(fileName);

          setTimeout(() => {
            if (saveToLocalStorage) {
              triggerLocalDownload(fileName);
            }
            setEmailStatus('sent');
            setIsSaving(false);
            setStep(3);
          }, 2000); 
        };

        const triggerLocalDownload = (filename) => {
          try {
            const link = document.createElement('a');
            link.href = photo || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } catch (e) {
            console.warn("Download bloqueado.");
          }
        };

        const resetApp = () => {
          setStep(1);
          setNfeNumber('');
          setCustomerName('');
          setDestCompany('');
          setPhoto(null);
          setLocation(null);
          setTimestamp(null);
          setSavedFileName('');
          setEmailStatus('idle');
          setCameraError(false);
          setAiAnalysisResult(null);
          setOccurrenceDraft('');
          setOccurrenceResult('');
          setShowOccurrenceSection(false);
        };

        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center font-sans">
            <div className="w-full bg-[#003366] text-white p-4 shadow-md sticky top-0 z-10">
              <div className="max-w-md mx-auto flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <div className="bg-white p-1 rounded">
                    <FileText className="text-[#003366] w-6 h-6" />
                  </div>
                  <div>
                    <h1 className="font-bold text-lg leading-tight">AF Datalink</h1>
                    <p className="text-xs text-blue-200">Canhoto Fácil Mobile</p>
                  </div>
                </div>
                <div className="text-xs font-semibold px-2.5 py-1 bg-blue-800 rounded-full">
                  Passo {step}/2
                </div>
              </div>
            </div>

            <div className="flex-1 w-full max-w-md p-4 flex flex-col justify-between">
              {step === 1 && (
                <div className="flex flex-col flex-1 space-y-4 justify-center">
                  <div className="text-center space-y-1 mb-2">
                    <div className="mx-auto w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center mb-1">
                      <FileText className="w-7 h-7 text-[#003366]" />
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800">Nova Entrega</h2>
                    <p className="text-gray-500 text-xs">Insira os dados de identificação do canhoto</p>
                  </div>

                  <div className="space-y-3">
                    <div className="space-y-1">
                      <label className="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">Número ou Chave da Nota</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Hash className="h-4 w-4 text-gray-400" />
                        </div>
                        <input
                          type="text"
                          className="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-xl focus:ring-[#003366] focus:border-[#003366] text-gray-800 font-semibold text-sm"
                          placeholder="Ex: 14502 ou Chave NFe"
                          value={nfeNumber}
                          onChange={(e) => setNfeNumber(e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">Nome do Recebedor</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <User className="h-4 w-4 text-gray-400" />
                        </div>
                        <input
                          type="text"
                          className="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-xl focus:ring-[#003366] focus:border-[#003366] text-gray-800 font-semibold text-sm"
                          placeholder="Nome completo de quem assinou"
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-bold text-gray-500 uppercase tracking-wider block">Empresa de Destino</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Building className="h-4 w-4 text-gray-400" />
                        </div>
                        <input
                          type="text"
                          className="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-xl focus:ring-[#003366] focus:border-[#003366] text-gray-800 font-semibold text-sm"
                          placeholder="Nome da empresa destinatária"
                          value={destCompany}
                          onChange={(e) => setDestCompany(e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between mt-1">
                      <div className="flex items-center space-x-3">
                        <div className="p-2 bg-blue-50 rounded-lg text-[#003366]">
                          <FolderDown className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-xs font-bold text-gray-700">Salvar Cópia no Celular</h4>
                          <p className="text-[9px] text-gray-400">Grava o arquivo na pasta do aparelho</p>
                        </div>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={saveToLocalStorage} 
                          onChange={(e) => setSaveToLocalStorage(e.target.checked)} 
                          className="sr-only peer" 
                        />
                        <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                      </label>
                    </div>
                  </div>

                  <button 
                    onClick={() => setStep(2)}
                    disabled={nfeNumber.trim().length < 2 || customerName.trim().length < 3 || destCompany.trim().length < 2}
                    className={`w-full p-3.5 rounded-xl font-bold text-base flex items-center justify-center space-x-2 transition-all shadow-md mt-4 ${
                      nfeNumber.trim().length < 2 || customerName.trim().length < 3 || destCompany.trim().length < 2
                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                        : 'bg-[#003366] text-white hover:bg-blue-800 active:scale-95'
                    }`}
                  >
                    <span>Prosseguir para Câmera</span>
                    <ArrowRight className="w-5 h-5" />
                  </button>
                </div>
              )}

              {step === 2 && (
                <div className="flex flex-col flex-1 space-y-3.5 overflow-y-auto max-h-[85vh] pr-1 pb-4">
                  <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <div className="truncate pr-4 flex-1">
                      <p className="text-[9px] text-gray-400 font-bold uppercase">Nota Fiscal / Recebedor / Destino</p>
                      <p className="font-bold text-xs text-[#003366] truncate">
                        NF: {nfeNumber} — {customerName} @ {destCompany}
                      </p>
                    </div>
                    <button onClick={() => setStep(1)} className="p-1.5 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-100 transition-colors flex-shrink-0">
                      <X className="w-4 h-4" />
                    </button>
                  </div>

                  <input 
                    type="file" 
                    accept="image/*" 
                    capture="environment" 
                    ref={fileInputRef}
                    onChange={handleFallbackPhotoCapture}
                    className="hidden"
                  />

                  <canvas ref={canvasRef} className="hidden" />

                  {!photo ? (
                    <div className="relative rounded-2xl overflow-hidden border border-gray-200 shadow-sm h-[220px] flex flex-col justify-between bg-black">
                      {isCameraLoading && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-white space-y-3 z-20">
                          <div className="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-white"></div>
                          <span className="text-xs text-gray-300">Inicializando câmera...</span>
                        </div>
                      )}

                      {!cameraError ? (
                        <div className="relative w-full h-full flex items-center justify-center overflow-hidden">
                          <video 
                            ref={videoRef} 
                            autoPlay 
                            playsInline 
                            muted
                            className="w-full h-full object-cover"
                          />
                          
                          {cameraStream && (
                            <button 
                              onClick={toggleCameraFacing}
                              className="absolute top-3 right-3 p-2 bg-black/60 hover:bg-black text-white rounded-full transition-colors"
                              title="Inverter Câmera"
                            >
                              <RefreshCw className="w-4 h-4" />
                            </button>
                          )}
                        </div>
                      ) : (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-100 text-gray-800 p-6 text-center space-y-4">
                          <div className="p-3 bg-amber-100 text-amber-700 rounded-full">
                            <AlertTriangle className="w-8 h-8" />
                          </div>
                          <div>
                            <h4 className="font-bold text-sm">Câmera Direta Indisponível</h4>
                            <p className="text-xs text-gray-500 mt-1">
                              Use a câmera integrada do sistema para tirar a foto.
                            </p>
                          </div>
                          <button 
                            onClick={() => fileInputRef.current.click()}
                            className="bg-[#003366] hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition-all active:scale-95 flex items-center space-x-2"
                          >
                            <Camera className="w-4 h-4" />
                            <span>Abrir Câmera</span>
                          </button>
                        </div>
                      )}

                      {cameraStream && !cameraError && (
                        <div className="absolute bottom-4 left-0 right-0 flex justify-center z-10">
                          <button 
                            onClick={capturePhotoFromStream}
                            className="w-14 h-14 bg-white border-4 border-[#003366] rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-all hover:bg-slate-50"
                            title="Tirar Foto"
                          >
                            <div className="w-9 h-9 bg-[#003366] rounded-full flex items-center justify-center text-white">
                              <Camera className="w-4 h-4" />
                            </div>
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="relative rounded-2xl overflow-hidden border border-gray-200 shadow-sm h-[220px] flex items-center justify-center bg-black">
                      <img src={photo} alt="Canhoto Capturado" className="max-h-full max-w-full object-contain" />
                      <button 
                        onClick={() => {
                          setPhoto(null);
                          setCameraError(false);
                          setAiAnalysisResult(null);
                        }}
                        className="absolute bottom-3 right-3 bg-white/95 hover:bg-white text-gray-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-lg"
                      >
                        <RefreshCw className="w-3.5 h-3.5 text-[#003366]" />
                        <span>Tirar Outra</span>
                      </button>
                    </div>
                  )}

                  {photo && (
                    <div className="bg-gradient-to-r from-blue-50 to-[#003366]/5 border border-[#003366]/20 p-3 rounded-xl space-y-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-2 text-[#003366] font-bold text-xs">
                          <Sparkles className="w-4 h-4 text-amber-500 animate-pulse" />
                          <span>✨ Análise de Canhoto por IA</span>
                        </div>
                        {!aiAnalysisResult && !isAiAnalyzing && (
                          <button
                            onClick={analyzeReceiptWithGemini}
                            className="bg-[#003366] hover:bg-blue-800 text-white text-[10px] px-2.5 py-1 rounded-lg font-bold transition-all shadow-xs flex items-center space-x-1"
                          >
                            <span>Auditar Canhoto</span>
                          </button>
                        )}
                      </div>

                      {isAiAnalyzing && (
                        <div className="flex items-center space-x-2 py-1 text-xs text-gray-600">
                          <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-[#003366]"></div>
                          <span className="animate-pulse">Analisando imagem com Gemini AI...</span>
                        </div>
                      )}

                      {aiAnalysisResult && (
                        <div className="space-y-2 text-xs pt-1">
                          <div className="grid grid-cols-2 gap-2">
                            <div className="bg-white p-2 rounded-lg border border-gray-100 flex items-center justify-between">
                              <span className="text-gray-400 text-[10px] uppercase font-bold">Assinatura</span>
                              {aiAnalysisResult.assinado ? (
                                <span className="bg-green-100 text-green-800 font-bold px-1.5 py-0.5 rounded text-[9px] flex items-center space-x-0.5">
                                  <Check className="w-3 h-3" />
                                  <span>Presente</span>
                                </span>
                              ) : (
                                <span className="bg-red-100 text-red-800 font-bold px-1.5 py-0.5 rounded text-[9px] flex items-center space-x-0.5">
                                  <X className="w-3 h-3" />
                                  <span>Não Detectada</span>
                                </span>
                              )}
                            </div>
                            <div className="bg-white p-2 rounded-lg border border-gray-100 flex items-center justify-between">
                              <span className="text-gray-400 text-[10px] uppercase font-bold">Legível</span>
                              {aiAnalysisResult.legivel ? (
                                <span className="bg-green-100 text-green-800 font-bold px-1.5 py-0.5 rounded text-[9px] flex items-center space-x-0.5">
                                  <Check className="w-3 h-3" />
                                  <span>OK</span>
                                </span>
                              ) : (
                                <span className="bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded text-[9px] flex items-center space-x-0.5">
                                  <AlertCircle className="w-3 h-3" />
                                  <span>Foco Ruim</span>
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="bg-white p-2 rounded-lg border border-gray-100">
                            <p className="text-gray-400 text-[9px] font-bold uppercase mb-0.5">Texto / Observação Extraída:</p>
                            <p className="text-gray-700 italic font-medium">"{aiAnalysisResult.observacoes_extraidas}"</p>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="bg-white p-3 rounded-xl border border-gray-200 space-y-2">
                    <button
                      type="button"
                      onClick={() => setShowOccurrenceSection(!showOccurrenceSection)}
                      className="w-full flex items-center justify-between text-xs font-bold text-gray-700 hover:text-[#003366] transition-colors"
                    >
                      <div className="flex items-center space-x-2">
                        <MessageSquare className="w-4 h-4 text-blue-600" />
                        <span>Registrar Ocorrência / Avaria?</span>
                      </div>
                      <span className="text-xs text-blue-600 font-semibold">
                        {showOccurrenceSection ? 'Ocultar' : 'Adicionar ✨'}
                      </span>
                    </button>

                    {showOccurrenceSection && (
                      <div className="space-y-2 pt-1">
                        <textarea
                          rows={2}
                          placeholder="Ex: caixa veio molhada mas testamos o cabo e funcionou..."
                          value={occurrenceDraft}
                          onChange={(e) => setOccurrenceDraft(e.target.value)}
                          className="w-full text-xs p-2 border border-gray-300 rounded-lg focus:ring-1 focus:ring-[#003366] focus:outline-none"
                        />
                        
                        {occurrenceDraft.trim() && !occurrenceResult && !isRefiningOccurrence && (
                          <button
                            type="button"
                            onClick={refineOccurrenceWithGemini}
                            className="w-full bg-[#003366] hover:bg-blue-800 text-white text-[10px] py-1.5 rounded-lg font-bold transition-all flex items-center justify-center space-x-1"
                          >
                            <Sparkles className="w-3.5 h-3.5 text-amber-400" />
                            <span>Refinar Ocorrência com IA</span>
                          </button>
                        )}

                        {isRefiningOccurrence && (
                          <div className="flex items-center justify-center space-x-2 py-2 text-xs text-gray-600">
                            <div className="animate-spin rounded-full h-3 w-3 border-b-2 border-[#003366]"></div>
                            <span className="animate-pulse">Otimizando relato com Gemini...</span>
                          </div>
                        )}

                        {occurrenceResult && (
                          <div className="bg-blue-50/70 p-2.5 rounded-lg border border-blue-100 space-y-1.5 text-xs text-left">
                            <p className="text-[9px] text-blue-800 uppercase font-bold">Relatório Formal Gerado:</p>
                            <p className="text-gray-700 whitespace-pre-line leading-relaxed font-medium">
                              {occurrenceResult}
                            </p>
                            <button
                              type="button"
                              onClick={() => {
                                setOccurrenceResult('');
                                setOccurrenceDraft('');
                              }}
                              className="text-[9px] text-red-500 font-bold hover:underline"
                            >
                              Limpar Relato
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-2">
                    <div className="flex items-start space-x-3 text-sm">
                      <MapPin className="w-4 h-4 text-[#003366] mt-0.5 flex-shrink-0" />
                      <div>
                        <p className="text-gray-400 text-[9px] uppercase font-bold tracking-wider">Localização da Captura (GPS)</p>
                        <p className="font-semibold text-gray-800 text-xs">
                          {location && typeof location.lat === 'string' && typeof location.lng === 'string'
                            ? `${location.lat}, ${location.lng}`
                            : 'Obtendo GPS...'}
                        </p>
                      </div>
                    </div>

                    <div className="flex items-start space-x-3 text-sm">
                      <Clock className="w-4 h-4 text-[#003366] mt-0.5 flex-shrink-0" />
                      <div>
                        <p className="text-gray-400 text-[9px] uppercase font-bold tracking-wider">Data e Horário</p>
                        <p className="font-semibold text-gray-800 text-xs">
                          {timestamp ? timestamp.toLocaleString('pt-BR') : 'Carregando horário...'}
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl space-y-1">
                    <div className="flex items-center space-x-2 text-[#003366] font-bold text-xs">
                      <Mail className="w-4 h-4" />
                      <span>Notificação por E-mail</span>
                    </div>
                    <p className="text-[10px] text-slate-600 leading-tight">
                      O comprovante será disparado de <strong className="text-slate-800 font-semibold">edson.sntsbrgs@gmail.com</strong> para <strong className="text-slate-800 font-semibold">edaon@afdatalink.com.br</strong> incluindo o arquivo estruturado.
                    </p>
                  </div>

                  <button 
                    onClick={handleSaveTrigger}
                    disabled={!photo || isSaving}
                    className={`w-full p-3.5 rounded-xl font-bold text-base flex items-center justify-center space-x-2 transition-all shadow-md mt-auto ${
                      !photo || isSaving
                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                        : 'bg-green-600 text-white hover:bg-green-700 active:scale-95'
                    }`}
                  >
                    {isSaving ? (
                      <div className="flex items-center space-x-2">
                        <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                        <span>Sincronizando & Enviando E-mail...</span>
                      </div>
                    ) : (
                      <>
                        <CheckCircle className="w-5 h-5" />
                        <span>Salvar & Enviar Canhoto</span>
                      </>
                    )}
                  </button>
                </div>
              )}

              {step === 3 && (
                <div className="flex flex-col flex-1 items-center justify-center space-y-4 p-4">
                  <div className="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center shadow-inner">
                    <CheckCircle className="w-8 h-8 text-green-600" />
                  </div>
                  
                  <div className="text-center space-y-1">
                    <h2 className="text-xl font-bold text-gray-800">Concluído com Sucesso!</h2>
                    <p className="text-gray-500 text-xs">Canhoto auditado, salvo e enviado via e-mail corporativo.</p>
                  </div>

                  <div className="w-full bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <div className="bg-[#003366] text-white p-2.5 px-3 flex items-center justify-between text-xs">
                      <span className="font-bold flex items-center space-x-1.5">
                        <Mail className="w-3.5 h-3.5" />
                        <span>E-mail Enviado</span>
                      </span>
                      <span className="bg-green-500 text-white font-bold text-[9px] px-1.5 py-0.5 rounded-full uppercase">
                        Sucesso
                      </span>
                    </div>
                    <div className="p-3 text-xs space-y-2 text-left bg-slate-50/50">
                      <div>
                        <p className="text-gray-400 text-[9px] font-bold uppercase">De:</p>
                        <p className="font-medium text-gray-700">edson.sntsbrgs@gmail.com</p>
                      </div>
                      <div>
                        <p className="text-gray-400 text-[9px] font-bold uppercase">Para:</p>
                        <p className="font-medium text-gray-700">edaon@afdatalink.com.br</p>
                      </div>
                      <div>
                        <p className="text-gray-400 text-[9px] font-bold uppercase">Assunto:</p>
                        <p className="font-medium text-gray-700">Canhoto NF {nfeNumber} — Recebedor: {customerName} — Destino: {destCompany}</p>
                      </div>

                      {occurrenceResult && (
                        <div className="border-t pt-2 mt-2">
                          <p className="text-red-600 text-[9px] font-bold uppercase mb-1">Ocorrência em Anexo (IA):</p>
                          <p className="bg-white p-2 rounded border border-red-100 text-[10px] text-gray-700 leading-normal">
                            {occurrenceResult}
                          </p>
                        </div>
                      )}

                      <div className="border-t pt-2 mt-1">
                        <p className="text-gray-400 text-[9px] font-bold uppercase mb-1">Anexo Renomeado:</p>
                        <div className="flex items-center space-x-1.5 bg-white p-2 rounded border border-gray-200 text-[10px] text-[#003366] font-mono break-all font-semibold leading-relaxed">
                          <Paperclip className="w-3.5 h-3.5 flex-shrink-0 text-[#003366]" />
                          <span>{savedFileName}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {saveToLocalStorage && (
                    <div className="bg-green-50 text-green-800 text-[11px] p-2.5 rounded-lg border border-green-100 flex items-center justify-center space-x-2 font-medium w-full text-center">
                      <ShieldCheck className="w-4 h-4 text-green-600 flex-shrink-0" />
                      <span>Arquivo baixado e armazenado localmente!</span>
                    </div>
                  )}

                  <button 
                    onClick={resetApp}
                    className="w-full bg-[#003366] hover:bg-blue-800 text-white p-3 rounded-xl font-bold text-sm transition-all shadow-lg active:scale-95"
                  >
                    Iniciar Nova Captura
                  </button>
                </div>
              )}
            </div>

            {showPermissionModal && (
              <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-50 p-4">
                <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl p-6 space-y-4">
                  <div className="flex items-start space-x-3">
                    <div className="p-3 bg-blue-100 text-[#003366] rounded-full">
                      <FolderDown className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="font-bold text-base text-gray-800">Permissão de Gravação</h3>
                      <p className="text-xs text-gray-500 mt-1">
                        O aplicativo "Canhoto Fácil Datalink" precisa de permissão de acesso ao armazenamento local do celular para salvar cópias organizadas dos canhotos.
                      </p>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[10px] text-gray-600 space-y-2">
                    <div className="flex items-center space-x-2 font-semibold text-gray-700">
                      <Info className="w-3.5 h-3.5 text-blue-600" />
                      <span>Como o arquivo será salvo?</span>
                    </div>
                    <p className="leading-relaxed">
                      Os canhotos serão salvos de forma organizada na pasta local de Downloads com o nome estruturado de auditoria:
                      <span className="block font-mono bg-white p-2 rounded border mt-1.5 text-[9px] text-center font-bold text-blue-900 break-all leading-normal">
                        CANHOTO_NF_[NF]_[RECEBEDOR]_[EMPRESA_DESTINO]_[TIMESTAMP].jpg
                      </span>
                    </p>
                  </div>

                  <div className="flex flex-col space-y-2">
                    <button 
                      onClick={grantFolderPermission}
                      className="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2"
                    >
                      <ShieldCheck className="w-4 h-4" />
                      <span>Permitir Acesso e Salvar</span>
                    </button>
                    <button 
                      onClick={denyFolderPermission}
                      className="w-full bg-slate-100 hover:bg-slate-200 text-gray-700 py-2.5 rounded-xl font-bold text-xs transition-all"
                    >
                      Salvar Apenas na Nuvem
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
